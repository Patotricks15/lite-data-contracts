[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-data-contracts"
version = "0.1.0"
description = "Versioned data contracts with validation and compatibility checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Data Contracts Contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
]

[project.scripts]
odc = "open_data_contracts.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_data_contracts"]