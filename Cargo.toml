[package]
name = "lite-data-contracts"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Fast, memory-conscious data contract validation"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
